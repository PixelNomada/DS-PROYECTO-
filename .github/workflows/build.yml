name: Compilar DSi IA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Nintendo DS
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20241104

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar entorno
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          test -f "$DEVKITARM/ds_rules"

      - name: Actualizar repositorios devkitPro
        run: |
          dkp-pacman -Syy --noconfirm

      - name: Instalar Nintendo DS SDK
        run: |
          dkp-pacman -S --needed --noconfirm nds-dev

      - name: Verificar libnds
        run: |
          test -f /opt/devkitpro/libnds/include/nds.h
          echo "libnds OK"
          ls -l /opt/devkitpro/libnds/include/nds.h

      - name: Compilar DSi IA
        run: make V=1

      - name: Verificar NDS
        run: |
          find . -maxdepth 2 -type f -name "*.nds" -print
          test -f DSi-IA.nds

      - name: Guardar NDS
        uses: actions/upload-artifact@v4
        with:
          name: DSi-IA-NDS
          path: DSi-IA.nds
          if-no-files-found: error
