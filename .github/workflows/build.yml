name: DSi-IA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar DSi-IA
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:20241104

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar devkitARM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          echo "$PATH"

          ls -la /opt/devkitpro/devkitARM/bin
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc --version

      - name: Compilar DSi-IA
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          make V=1

      - name: Buscar NDS
        run: |
          echo "=== ARCHIVOS NDS ==="
          find . -type f -name "*.nds" -print

      - name: Guardar NDS
        uses: actions/upload-artifact@v4
        with:
          name: DSi-IA-NDS
          path: "*.nds"
          if-no-files-found: error
