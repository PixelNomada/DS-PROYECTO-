name: Compilar DSi IA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilar DSi IA
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:20241104

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar entorno Nintendo DS
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          test -f "$DEVKITARM/ds_rules"

      - name: Instalar libnds
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          export PATH=/opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:$PATH

          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm nds-dev

      - name: Comprobar libnds
        run: |
          test -f /opt/devkitpro/libnds/include/nds.h
          echo "libnds instalado correctamente."

      - name: Compilar DSi IA
        run: make V=1

      - name: Comprobar NDS
        run: |
          ls -lh
          test -f DSi-IA.nds
          echo "DSi-IA.nds generado correctamente."

      - name: Guardar NDS
        uses: actions/upload-artifact@v4
        with:
          name: DSi-IA-NDS
          path: DSi-IA.nds
          if-no-files-found: error
